services:
  #----------------------------------------------------------------------------------------------
  nodeapp:
    build:
      context: ./mynode_network
      dockerfile: Dockerfile

    depends_on:
      mongo:
        condition: service_healthy

    volumes:
      - ./mynode_network:/app
  #----------------------------------------------------------------------------------------------
  nginx:
    image: nginx:latest

    ports:
      - "8080:80"
      
    volumes:
      - ./nginx-html:/usr/share/nginx/html
  #----------------------------------------------------------------------------------------------
  mongo: 
    image: mongo:latest
    healthcheck:
      #test: "exit 0"
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    volumes:
       - mongo-data:/data/db
       #- ./mongo-data:/data/db #Cria um diretório para persistência dos dados do MongoDB
       
#----------------------------------------------------------------------------------------------
volumes:
  mongo-data:
#----------------------------------------------------------------------------------------------